[project]
name = "pythonproject"
version = "0.1.0"
description = ""
authors = [
    {name = "Laktionov",email = "ber_lak@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas (>=2.3.0,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "pytest (>=8.4.1,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
isort = "^6.0.1"
black = "^25.1.0"
flake8 = "^7.2.0"


[tool.poetry.group.dev.dependencies]
isort = "^6.0.1"
pytest-cov = "^6.2.1"
pytest = "^8.4.1"
coverage = "^7.9.1"

[tool.isort]
# максимальная длина строки
line_length = 119
[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'